name: Build Desktop APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Build Opencode binary for Android (arm64)
        run: |
          chmod +x scripts/build-opencode-android.sh
          ./scripts/build-opencode-android.sh || (echo "Go build falhou, stub"; mkdir -p app/src/main/assets; echo "#!/system/bin/sh\necho stub" > app/src/main/assets/opencode; chmod +x app/src/main/assets/opencode)
          ls -lh app/src/main/assets/ || true
          file app/src/main/assets/opencode || true

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.6
          chmod +x gradlew
          ls -lh gradlew gradle/wrapper/

      - name: Build Debug APK (Desktop WebView)
        run: |
          ./gradlew assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/ || true
          find app/build -name "*.apk" -ls || true

      - name: Upload Desktop APK
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
